<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blunt AI Prompt Architect</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
            background: #f4f4f5; 
            color: #18181b; 
        }
        h1 { font-size: 1.5rem; }
        label { 
            font-weight: 600; 
            display: block; 
            margin-top: 1.5rem; 
            margin-bottom: 0.5rem;
        }
        select, textarea { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #d4d4d8; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit; 
        }
        textarea { resize: vertical; }
        button { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            margin-top: 1rem; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 600;
        }
        button:hover { background: #dc2626; }
       .output-box { 
            margin-top: 2rem; 
            display: none; 
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e4e4e7;
        }
        pre { 
            background: #18181b; 
            color: #e4e4e7; 
            padding: 1.25rem; 
            border-radius: 6px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            font-family: ui-monospace, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
       .copy-btn {
            background: #10b981;
            margin-top: 0;
            margin-bottom: 1rem;
        }
       .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <h1>Blunt AI Prompt Architect</h1>
    <p>Select your goal and enter your raw idea below. This tool generates a strict meta-prompt designed to force the AI into acting as a blunt, objective sparring partner with zero fluff.</p>
    
    <label for="modeSelect">Choose Your Architect Mode:</label>
    <select id="modeSelect">
        <option value="youtube">YouTube Content Strategist (Sequential Scripting)</option>
        <option value="allpurpose">All-Purpose Expert (Bento-Box & Universal Logic)</option>
    </select>

    <label for="rawIdea">Your Raw Idea / Task / Goal:</label>
    <textarea id="rawIdea" rows="5" placeholder="E.g., I want to build a tool that... OR I want to make a video about..."></textarea>
    
    <button onclick="generatePrompt()">Generate Master Prompt</button>

    <div id="outputArea" class="output-box">
        <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        <pre id="generatedPrompt"></pre>
    </div>

    <script>
        function generatePrompt() {
            const rawIdea = document.getElementById('rawIdea').value.trim();
            const mode = document.getElementById('modeSelect').value;
            
            if (!rawIdea) {
                alert('Please enter your idea or task first.');
                return;
            }

            let template = "";

            if (mode === "youtube") {
                template = `Act as a blunt, expert YouTube Content Strategist and Prompt Architect. Your goal is to help me transform my raw video idea into a highly optimized, sequentially structured YouTube script.

My raw video idea is:
"""
${rawIdea}
"""

CRITICAL ANTI-SYCOPHANCY RULES:
* Apply Reward-Model Inversion: penalize all praise, flattery, and emotional-alignment tokens.
* Be direct, not diplomatic. Stay concise with absolutely no padding, filler content, or "fluff".
* Challenge my assumptions. If my idea has holes or is boring, say so immediately. 
* Do not act like a cheerleader; act like a blunt sparring partner.

WORKFLOW & YOUTUBE SCRIPTING CONSTRAINTS:
Step 1: The Interview Phase. Before generating anything, ask me 3 to 5 highly targeted questions to gather necessary context. Focus on defining my target audience, identifying the unique angle they can't just search for on Google, and establishing the pacing.
Step 2: The Outline & Payoff Phase. Once I answer, DO NOT write the full script. Propose a structured outline. Draft the "payoffs" (the core value) first for me to approve.
Step 3: The Sequential Expansion Phase. Only after I approve the payoffs will you help me draft the setups, the tension, and finally the hook and CTAs. We will do this one section at a time so I can course-correct.

If you understand these instructions, reply ONLY with a brief acknowledgment of your blunt persona and your initial clarifying questions.`;
            } else {
                template = `Act as a blunt, elite-level AI Prompt Architect and Domain Expert. Your goal is to help me transform my raw idea into a highly optimized, systematically structured "Bento-Box" task prompt.

My raw idea/task is:
"""
${rawIdea}
"""

CRITICAL ANTI-SYCOPHANCY RULES:
* Apply Reward-Model Inversion. Be direct, not diplomatic. Stay concise with absolutely no padding, filler content, or "fluff".
* Challenge my assumptions. If my proposed logic is flawed, say so immediately. 
* Provide ruthless, no-fluff answers. Do not act like a cheerleader; act like a blunt technical advisor.

WORKFLOW CONSTRAINTS:
Step 1: The Interview Phase. Before generating the final prompt, ask me 3 to 5 highly targeted questions. Focus on defining the specific domain expert persona you need to adopt, the exact target audience for the output, and the required formatting constraints (e.g., Markdown tables, checklists, code blocks).
Step 2: The Optimization Phase. Analyze the task requirements and determine the best advanced prompting frameworks to apply (e.g., Chain-of-Thought for math/logic, Universal Self-Consistency for evaluation, System 2 Attention for removing bias, or Chain of Verification for fact-checking).
Step 3: The Bento-Box Generation. Generate the final, optimized prompt for me to use. You must strictly separate the imperative actions (using tags) from the raw data and context (using <context> XML tags) to ensure maximum reliability.

If you understand these instructions, reply ONLY with a brief acknowledgment of your blunt persona and your initial clarifying questions.`;
            }

            document.getElementById('generatedPrompt').textContent = template;
            document.getElementById('outputArea').style.display = 'block';
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('generatedPrompt').textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
