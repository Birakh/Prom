<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Fluff YouTube Prompt Architect</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
            background: #f4f4f5; 
            color: #18181b; 
        }
        h1 { font-size: 1.5rem; }
        label { 
            font-weight: 600; 
            display: block; 
            margin-top: 1.5rem; 
            margin-bottom: 0.5rem;
        }
        textarea { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #d4d4d8; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit; 
            resize: vertical;
        }
        button { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            margin-top: 1rem; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 600;
        }
        button:hover { background: #dc2626; }
      .output-box { 
            margin-top: 2rem; 
            display: none; 
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e4e4e7;
        }
        pre { 
            background: #18181b; 
            color: #e4e4e7; 
            padding: 1.25rem; 
            border-radius: 6px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            font-family: ui-monospace, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
      .copy-btn {
            background: #10b981;
            margin-top: 0;
            margin-bottom: 1rem;
        }
      .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <h1>Blunt YouTube Prompt Architect</h1>
    <p>Enter your raw video idea below. This tool generates a strict meta-prompt designed to force the AI into acting as a blunt sparring partner to sequentially build a high-retention YouTube script.</p>
    
    <label for="rawIdea">Your Raw YouTube Idea / Title Angle:</label>
    <textarea id="rawIdea" rows="5" placeholder="E.g., I want to make a video about why most budget microphones actually sound terrible and how to fix them..."></textarea>
    
    <button onclick="generatePrompt()">Generate YouTube Master Prompt</button>

    <div id="outputArea" class="output-box">
        <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        <pre id="generatedPrompt"></pre>
    </div>

    <script>
        function generatePrompt() {
            const rawIdea = document.getElementById('rawIdea').value.trim();
            if (!rawIdea) {
                alert('Input required.');
                return;
            }

            const template = `Act as a blunt, expert YouTube Content Strategist and Prompt Architect. Your goal is to help me transform my raw video idea into a highly optimized, sequentially structured YouTube script.

My raw video idea is:
"""
${rawIdea}
"""

CRITICAL ANTI-SYCOPHANCY RULES:
* Apply Reward-Model Inversion: penalize all praise, flattery, and emotional-alignment tokens.
* Be direct, not diplomatic. Stay concise with absolutely no padding, filler content, or "fluff".
* Challenge my assumptions. If my idea has holes or is boring, say so immediately. 
* Do not act like a cheerleader; act like a blunt sparring partner.

WORKFLOW & YOUTUBE SCRIPTING CONSTRAINTS:
Step 1: The Interview Phase. Before generating anything, ask me 3 to 5 highly targeted questions to gather necessary context. Focus on defining my target audience, identifying the unique angle they can't just search for on Google, and establishing the pacing.
Step 2: The Outline & Payoff Phase. Once I answer, DO NOT write the full script. Propose a structured outline. Draft the "payoffs" (the core value) first for me to approve.
Step 3: The Sequential Expansion Phase. Only after I approve the payoffs will you help me draft the setups, the tension, and finally the hook and CTAs. We will do this one section at a time so I can course-correct.

If you understand these instructions, reply ONLY with a brief acknowledgment of your blunt persona and your initial clarifying questions.`;

            document.getElementById('generatedPrompt').textContent = template;
            document.getElementById('outputArea').style.display = 'block';
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('generatedPrompt').textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
