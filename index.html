<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 AI Prompt Architect Generator</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
            background: #f4f4f5; 
            color: #18181b; 
        }
        h1 { font-size: 1.5rem; }
        label { 
            font-weight: 600; 
            display: block; 
            margin-top: 1.5rem; 
            margin-bottom: 0.5rem;
        }
        textarea { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #d4d4d8; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit; 
            resize: vertical;
        }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            margin-top: 1rem; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 600;
        }
        button:hover { background: #1d4ed8; }
       .output-box { 
            margin-top: 2rem; 
            display: none; 
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e4e4e7;
        }
        pre { 
            background: #18181b; 
            color: #e4e4e7; 
            padding: 1.25rem; 
            border-radius: 6px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            font-family: ui-monospace, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
       .copy-btn {
            background: #10b981;
            margin-top: 0;
            margin-bottom: 1rem;
        }
       .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <h1>AI Prompt Architect (2026 Taxonomy)</h1>
    <p>Enter your raw idea below. This tool generates a strict meta-prompt designed to force any AI into an expert-level interview and optimization loop based on state-of-the-art reasoning frameworks.</p>
    
    <label for="rawIdea">Your Raw Idea / Task / Goal:</label>
    <textarea id="rawIdea" rows="5" placeholder="E.g., I want to build a tool that analyzes financial documents and extracts key risk factors..."></textarea>
    
    <button onclick="generatePrompt()">Generate Meta-Prompt</button>

    <div id="outputArea" class="output-box">
        <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        <pre id="generatedPrompt"></pre>
    </div>

    <script>
        function generatePrompt() {
            const rawIdea = document.getElementById('rawIdea').value.trim();
            if (!rawIdea) {
                alert('Input required.');
                return;
            }

            const template = `Act as a Master AI Prompt Architect operating at the 2026 state-of-the-art level. Your goal is to help me transform my raw idea into a highly optimized, systematically structured prompt.

My raw idea/task is:
"""
${rawIdea}
"""

You possess deep knowledge of the complete taxonomy of advanced prompting techniques, including:
* Foundational: Zero-shot and Few-shot.
* Linear Logic: Chain-of-Thought (CoT).
* Topological Reasoning: Tree of Thoughts (ToT), Graph of Thoughts (GoT), Skeleton-of-Thought (SoT), Framework of Thoughts (FoT).
* Ensembling: Standard and Universal Self-Consistency.
* Agentic/Action-Oriented: ReAct, Reflexion, Chain of Verification (CoVe).
* Analogical/Hybrid: Thought Propagation (TP), Chain of Code (CoC).
* Attention/Context Management: System 2 Attention (S2A), Chain of Density (CoD).
* Declarative/Modular: DSPy signatures, Model Context Protocol (MCP) templates.

We will collaboratively build the perfect prompt using this strict workflow:

Step 1: The Interview Phase. Ask me 3 to 5 highly targeted, clarifying questions to gather necessary context. Focus on defining a granular persona, naming the specific target audience, and establishing structural constraints or output formats. Do not generate the final prompt until I have answered these questions.
Step 2: The Optimization Phase. Once I provide the answers, analyze the task requirements and select the most appropriate combination of advanced techniques from your taxonomy.
Step 3: The Final Output. Present the final, optimized prompt clearly in a code block so I can copy and paste it. Below the prompt, briefly explain which specific prompting techniques you integrated and why they will improve the model's performance for this specific task.

If you understand these instructions, reply ONLY with a brief acknowledgment and your 3 to 5 clarifying questions.`;

            document.getElementById('generatedPrompt').textContent = template;
            document.getElementById('outputArea').style.display = 'block';
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('generatedPrompt').textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
